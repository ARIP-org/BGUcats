<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BGUcats Labelling</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* A working tool, used one-handed on a phone: sticky tabs on top, the
     content in the middle, the one decision that matters in a sticky bar at
     the bottom within thumb reach. */
  :root {
    --bg: #f4f6f7; --surface: #fff; --surface-2: #eceff2; --ink: #10161c; --muted: #5a6672;
    --line: #d9dfe4; --line-strong: #b9c3cb; --accent: #a35c00; --accent-ink: #fff; --accent-soft: #fdf2e0;
    --good: #0a6f4c; --good-soft: #dff1e8; --warn: #8f5a00; --warn-soft: #fbeed6;
    --bad: #b3261e; --bad-soft: #fbe6e4; --info: #0d6a6a; --info-soft: #dff0f0;
    --sel: #1d63c7;
    --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --font-cond: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1318; --surface: #161d25; --surface-2: #1d262f; --ink: #e7ecf0; --muted: #92a0ac;
      --line: #27313b; --line-strong: #3a4753; --accent: #f0a830; --accent-ink: #1a1205; --accent-soft: #2b2112;
      --good: #4fd096; --good-soft: #12291f; --warn: #f0b552; --warn-soft: #2b2212;
      --bad: #ff8a80; --bad-soft: #321816; --info: #4cc4bb; --info-soft: #10292a; --sel: #6aa6ff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .label { font-family: var(--font-cond); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }

  header.bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .bar-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-weight: 700; letter-spacing: -.01em; font-size: 16px; }
  .brand span { color: var(--muted); font-weight: 500; }
  .tabs { display: flex; gap: 4px; margin-top: 6px; }
  .tab { border: 0; background: none; padding: 9px 12px 10px; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; font-weight: 500; }
  .tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .tab .n { font-family: var(--font-mono); font-size: 12px; margin-left: 6px; padding: 1px 6px; border-radius: 999px; background: var(--surface-2); }
  .linkish { border: 0; background: none; color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline; padding: 6px 0; }

  main { max-width: 900px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) 120px max(16px, env(safe-area-inset-left)); display: grid; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  h1 { font-size: 22px; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
  h2 { font-size: 17px; margin: 0; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 10px 14px; min-height: 44px; cursor: pointer; font-weight: 500; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.danger { color: var(--bad); border-color: var(--bad); }
  .btn.small { min-height: 34px; padding: 6px 10px; font-size: 13.5px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .back { border: 0; background: none; color: var(--muted); padding: 4px 0; cursor: pointer; font-size: 14px; }

  .big { font-family: var(--font-mono); font-size: 34px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
  .stack { display: grid; gap: 10px; }
  .qcard { display: grid; gap: 10px; text-align: left; width: 100%; cursor: pointer; }
  .qcard:hover { border-color: var(--line-strong); }
  .strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .strip img, .strip .ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: var(--surface-2); display: block; }
  .meta { font-size: 13.5px; color: var(--muted); display: flex; gap: 6px 12px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-cond); font-weight: 600; font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .chip.good { background: var(--good-soft); color: var(--good); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.info { background: var(--info-soft); color: var(--info); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
  .tile { position: relative; border: 0; padding: 0; border-radius: 9px; overflow: hidden; background: var(--surface-2); cursor: pointer; aspect-ratio: 1; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .badge { position: absolute; left: 4px; top: 4px; }
  .tile .zoom { position: absolute; right: 4px; bottom: 4px; width: 30px; height: 30px; border-radius: 8px; border: 0; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; font-size: 15px; line-height: 30px; }
  .tile.dim img { opacity: .35; }
  .tile.sel { outline: 3px solid var(--sel); outline-offset: -3px; }
  .tile.sel::after { content: "\2713"; position: absolute; right: 6px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--sel); color: #fff; text-align: center; line-height: 24px; font-weight: 700; font-size: 14px; }
  .ph { display: grid; place-items: center; color: var(--muted); font-size: 12px; width: 100%; height: 100%; }

  .actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .actions .inner { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .actions .inner .btn.primary { flex: 1 1 180px; }

  .banner { border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .banner.info { background: var(--info-soft); color: var(--ink); border: 1px solid var(--info); }
  .banner.bad { background: var(--bad-soft); border: 1px solid var(--bad); }

  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .catcard { text-align: left; display: grid; gap: 6px; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  .catcard.picked { outline: 3px solid var(--accent); outline-offset: -1px; }
  .catcard img, .catcard .ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 7px; background: var(--surface-2); }
  .catcard .nm { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cov { display: grid; gap: 3px; font-size: 11.5px; color: var(--muted); }
  .meter { height: 5px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--good); }
  .meter i.below { background: var(--warn); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .fchip { border: 1px solid var(--line); background: var(--surface); padding: 6px 11px; border-radius: 999px; cursor: pointer; font-size: 13px; min-height: 34px; }
  .fchip[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 900px; max-height: 88vh; overflow: auto; border-radius: 16px 16px 0 0;
    padding: 16px max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: grid; gap: 14px; }
  .field { display: grid; gap: 6px; }
  .field input, .field textarea, .field select { font: inherit; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); min-height: 44px; width: 100%; }
  .choice { display: flex; gap: 6px; flex-wrap: wrap; }
  .choice button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 9px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
  .choice button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }

  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 50; display: grid; place-items: center; padding: 16px; }
  .lightbox img { max-width: 100%; max-height: 88vh; border-radius: 8px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 60;
    background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
  .empty { text-align: center; padding: 28px 12px; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
  .sessrow { display: grid; gap: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-top">
    <div class="brand">BGUcats <span>labelling</span></div>
    <button class="linkish" id="signout" hidden>Sign out</button>
  </div>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="queue">Queue<span class="n mono" id="qcount">–</span></button>
    <button class="tab" data-tab="cats">Cats<span class="n mono" id="ccount">–</span></button>
  </nav>
</header>
<main id="main" aria-live="polite"></main>
<div class="actions" id="actions" hidden><div class="inner" id="actions-inner"></div></div>
<div id="overlay"></div>

<script>
(function () {
  "use strict";
  const TOKEN_KEY = "bgucats-admin-token";
  const state = { token: null, catalog: null, queueCursor: null, queue: [], queueSize: null,
                  session: null, selected: new Set(), catFilter: null, catSort: "need" };
  const $ = (id) => document.getElementById(id);

  // ---- tiny DOM builder: every string becomes a text node, never HTML ----
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
      el.appendChild(typeof kid === "string" || typeof kid === "number" ? document.createTextNode(String(kid)) : kid);
    return el;
  }
  const img = (src, alt) => src ? h("img", { src, alt: alt || "", loading: "lazy" }) : h("div", { class: "ph", text: "processing…" });

  // ---- token: per-device convenience, stored only in this browser ----
  function loadToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function saveToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} state.token = t; }
  function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} state.token = null; }

  // ---- ids: ULIDs generated here so a retried create cannot make a 2nd cat ----
  function ulid() {
    const A = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
    let t = Date.now(), out = "";
    for (let i = 0; i < 10; i++) { out = A[t % 32] + out; t = Math.floor(t / 32); }
    const r = crypto.getRandomValues(new Uint8Array(16));
    for (let i = 0; i < 16; i++) out += A[r[i] % 32];
    return out;
  }

  async function api(method, path, body) {
    const res = await fetch("/admin/api/" + path, {
      method, headers: { Authorization: "Bearer " + state.token, "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    if (res.status === 401) { clearToken(); gate("That token was refused. Paste it again."); throw new Error("unauthorised"); }
    let data = {}; try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.error || ("request failed (" + res.status + ")"));
    return data;
  }

  let toastTimer = null;
  function toast(msg) {
    const old = document.querySelector(".toast"); if (old) old.remove();
    const t = h("div", { class: "toast", role: "status", text: msg });
    document.body.appendChild(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
  }
  function fail(err) { if (err.message !== "unauthorised") toast(err.message); }

  function refreshCounts() {
    api("GET", "queue").then((d) => { state.queueSize = d.queueSize; $("qcount").textContent = d.queueSize; }).catch(() => {});
    if (state.catalog) $("ccount").textContent = state.catalog.cats.length;
  }

  // Stored statuses are spec values (§6.3); the page shows plain words.
  const STATUS_TEXT = { unlabeled: "to label", labeled: "labelled", rejected: "rejected", duplicate: "duplicate", pending: "uploading" };
  const statusText = (s) => STATUS_TEXT[s] || s;

  const fmtTime = (iso) => { if (!iso) return ""; const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
  const catName = (c) => c.displayName || ("Unnamed · " + c.catId.slice(-4));

  function setActions(...buttons) {
    // Callers pass null for a button that does not apply; replaceChildren would
    // render that as the text "null".
    const present = buttons.filter(Boolean);
    $("actions-inner").replaceChildren(...present);
    $("actions").hidden = present.length === 0;
  }
  function closeOverlay() { $("overlay").replaceChildren(); }

  // ---- token gate ----
  function gate(message) {
    $("signout").hidden = true;
    setActions();
    const input = h("input", { id: "tok", type: "password", autocomplete: "current-password", placeholder: "admin token" });
    const form = h("form", { class: "card stack", onsubmit: (e) => { e.preventDefault(); if (input.value.trim()) { saveToken(input.value.trim()); route(); } } },
      h("h1", { text: "Sign in" }),
      h("p", { class: "muted", text: "Paste the admin token. It is kept in this browser only, and sent with each request." }),
      message ? h("div", { class: "banner bad", text: message }) : null,
      h("label", { class: "field" }, h("span", { class: "label", text: "Admin token" }), input),
      h("button", { class: "btn primary", type: "submit", text: "Continue" }));
    $("main").replaceChildren(form);
    input.focus();
  }

  // ---- queue ----
  async function showQueue(more) {
    setTab("queue"); setActions();
    if (!more) { state.queue = []; state.queueCursor = null; }
    const data = await api("GET", "queue" + (more && state.queueCursor ? "?cursor=" + encodeURIComponent(state.queueCursor) : ""));
    const seen = new Set(state.queue.map((e) => e.session.sessionId));
    for (const e of data.sessions) if (!seen.has(e.session.sessionId)) state.queue.push(e);
    state.queueCursor = data.cursor; state.queueSize = data.queueSize;
    $("qcount").textContent = data.queueSize;

    const head = h("div", { class: "card" },
      h("span", { class: "label", text: "Waiting to be labelled" }),
      h("div", { class: "row", style: "align-items:baseline;margin-top:4px" },
        h("span", { class: "big", text: data.queueSize }),
        h("span", { class: "muted", text: data.queueSize === 1 ? "photo" : "photos" })),
      h("p", { class: "muted", style: "margin:6px 0 0;font-size:13.5px",
        text: data.queueSize > 500 ? "That's a backlog — a few sessions a day keeps it from becoming a wall."
             : "Ten minutes a day keeps this near zero." }));

    if (!state.queue.length) {
      $("main").replaceChildren(head, h("div", { class: "card empty" },
        h("b", { text: "Nothing to label" }), "New photos appear here as the bot receives them."));
      return;
    }
    const list = h("div", { class: "stack" }, state.queue.map((e) => {
      const s = e.session;
      const strip = h("div", { class: "strip" }, e.preview.map((p) => img(p.thumb)));
      return h("button", { class: "card qcard", onclick: () => go("session/" + s.sessionId) },
        strip,
        h("div", { class: "meta" },
          h("span", {}, h("b", { text: e.unlabeledCount }), e.unlabeledCount === 1 ? " photo" : " photos"),
          h("span", { text: fmtTime(s.startedAt) }),
          s.submitter ? h("span", { class: "mono", text: "from " + s.submitter }) : null,
          e.nearDuplicates ? h("span", { class: "chip warn", text: e.nearDuplicates + " near-duplicate" + (e.nearDuplicates > 1 ? "s" : "") }) : null,
          s.catId ? h("span", { class: "chip info", text: "already a known cat" }) : null));
    }));
    const moreBtn = state.queueCursor ? h("button", { class: "btn", onclick: () => showQueue(true).catch(fail), text: "Load more" }) : null;
    $("main").replaceChildren(head, list, moreBtn || "");
  }

  // ---- session ----
  async function showSession(id) {
    setTab("queue");
    const data = await api("GET", "sessions/" + id);
    state.session = data; state.selected = new Set();
    renderSession();
  }

  function renderSession() {
    const { session: s, photos, cat } = state.session;
    const counts = {}; for (const p of photos) counts[p.status] = (counts[p.status] || 0) + 1;
    const head = h("div", { class: "stack" },
      h("button", { class: "back", onclick: () => go("queue"), text: "← Queue" }),
      h("h1", { text: "Session · " + photos.length + " photo" + (photos.length === 1 ? "" : "s") }),
      h("div", { class: "meta" },
        h("span", { text: fmtTime(s.startedAt) + (s.lastPhotoAt && fmtTime(s.lastPhotoAt) !== fmtTime(s.startedAt) ? " – " + fmtTime(s.lastPhotoAt) : "") }),
        s.submitter ? h("span", { class: "mono", text: "from " + s.submitter }) : null,
        ...Object.entries(counts).map(([k, v]) => h("span", { class: "chip" + (k === "unlabeled" ? " warn" : k === "labeled" ? " good" : k === "rejected" ? " bad" : ""), text: v + " " + statusText(k) }))),
      cat ? h("div", { class: "banner info" }, "Assigned to ", h("b", { text: catName(cat) }), ". Assigning again relabels any photos added since.") : null,
      h("p", { class: "muted", style: "margin:0;font-size:13.5px", text: "One encounter, one cat. Tap photos to select bad ones; tap ⤢ to see a photo larger." }));

    const grid = h("div", { class: "grid" }, photos.map((p) => {
      const sel = state.selected.has(p.photoId);
      const dim = p.status === "rejected" || p.status === "duplicate";
      const badge = p.status === "duplicate" ? h("span", { class: "chip bad badge", text: "duplicate" })
        : p.status === "rejected" ? h("span", { class: "chip bad badge", text: "rejected" })
        : p.nearDuplicateOf ? h("span", { class: "chip warn badge", text: "near-dup" })
        : p.status === "labeled" ? h("span", { class: "chip good badge", text: "labelled" }) : null;
      const tile = h("div", { class: "tile" + (sel ? " sel" : "") + (dim ? " dim" : ""), role: "button", tabindex: "0",
          "aria-pressed": String(sel), "aria-label": "Photo, " + statusText(p.status),
          onclick: () => toggle(p.photoId), onkeydown: (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(p.photoId); } } },
        img(p.thumb), badge,
        p.medium ? h("button", { class: "zoom", "aria-label": "View larger", text: "⤢",
          onclick: (e) => { e.stopPropagation(); lightbox(p.medium); } }) : null);
      return tile;
    }));
    $("main").replaceChildren(head, grid);
    sessionActions();
  }

  function toggle(pid) {
    if (state.selected.has(pid)) state.selected.delete(pid); else state.selected.add(pid);
    renderSession();
  }

  function sessionActions() {
    const { session: s, photos } = state.session;
    const n = state.selected.size;
    if (n) {
      const sel = photos.filter((p) => state.selected.has(p.photoId));
      const canRestore = sel.some((p) => p.status === "rejected");
      const canReject = sel.some((p) => p.status !== "rejected");
      setActions(
        h("span", { class: "grow", style: "font-weight:600", text: n + " selected" }),
        canRestore ? h("button", { class: "btn", onclick: () => restoreSelected().catch(fail), text: "Restore" }) : null,
        canReject ? h("button", { class: "btn danger", onclick: () => rejectSelected().catch(fail), text: "Reject" }) : null,
        h("button", { class: "btn", onclick: () => { state.selected.clear(); renderSession(); }, text: "Clear" }));
      return;
    }
    const assignable = photos.filter((p) => p.status === "unlabeled" || p.status === "labeled").length;
    setActions(
      h("button", { class: "btn primary", disabled: !assignable, onclick: () => pickCat({
          title: "Which cat is this?", subtitle: assignable + " photo" + (assignable === 1 ? "" : "s") + " will be labelled.",
          confirm: (c) => "Assign to " + catName(c), onPick: (c) => assignTo(c), allowNew: true }), text: "This is…" }),
      h("button", { class: "btn", disabled: !assignable, onclick: () => catForm(null), text: "New cat" }),
      h("button", { class: "btn danger", disabled: !assignable, onclick: () => rejectSession(), text: "Reject" }));
  }

  async function assignTo(cat) {
    const sid = state.session.session.sessionId;
    const r = await api("POST", "sessions/" + sid + "/assign", { catId: cat.catId });
    state.catalog = null; // counts and a new cat's photo changed
    toast(r.labeled + " photo" + (r.labeled === 1 ? "" : "s") + " → " + catName(cat));
    refreshCounts();
    next(sid);
  }

  function next(doneSid) {
    // Straight to the next session: the queue is worked through, not browsed.
    const i = state.queue.findIndex((e) => e.session.sessionId === doneSid);
    if (i >= 0) state.queue.splice(i, 1);
    const nxt = state.queue.find((e) => e.session.sessionId !== doneSid);
    closeOverlay();
    go(nxt ? "session/" + nxt.session.sessionId : "queue");
  }

  async function rejectSelected() {
    const ids = [...state.selected];
    const reason = await askReason("Reject " + ids.length + " photo" + (ids.length === 1 ? "" : "s") + "?");
    if (!reason) return;
    await api("POST", "photos/reject", { photoIds: ids, reason });
    toast("Rejected " + ids.length); refreshCounts(); await showSession(state.session.session.sessionId);
  }
  async function restoreSelected() {
    const ids = [...state.selected].filter((id) => state.session.photos.find((p) => p.photoId === id).status === "rejected");
    const r = await api("POST", "photos/restore", { photoIds: ids });
    toast("Restored " + r.restored + " — back in the queue"); refreshCounts(); await showSession(state.session.session.sessionId);
  }
  async function rejectSession() {
    const reason = await askReason("Reject the whole session?");
    if (!reason) return;
    const sid = state.session.session.sessionId;
    await api("POST", "sessions/" + sid + "/reject", { reason }).catch(fail);
    toast("Session rejected"); refreshCounts(); next(sid);
  }

  function askReason(title) {
    return new Promise((resolve) => {
      const reasons = ["Not a cat", "Can't see the cat", "More than one cat", "Unusable photo"];
      let picked = reasons[0];
      const opts = h("div", { class: "choice" }, reasons.map((r) => h("button", { "aria-pressed": String(r === picked),
        onclick: (e) => { picked = r; for (const b of opts.children) b.setAttribute("aria-pressed", String(b.textContent === r)); }, text: r })));
      const done = (v) => { closeOverlay(); resolve(v); };
      sheet(h("h2", { text: title }),
        h("p", { class: "muted", style: "margin:0", text: "Rejected photos leave the dataset. The original is kept, so this can be undone." }),
        opts,
        h("div", { class: "row" },
          h("button", { class: "btn danger", style: "flex:1", onclick: () => done(picked), text: "Reject" }),
          h("button", { class: "btn", onclick: () => done(null), text: "Cancel" })));
    });
  }

  // ---- cat picker (with the spec's coat-colour filter) ----
  async function catalog() {
    if (!state.catalog) state.catalog = await api("GET", "cats");
    return state.catalog;
  }

  async function pickCat({ title, subtitle, confirm, onPick, exclude, allowNew }) {
    const data = await catalog();
    let filter = null, query = "", picked = null;
    const grid = h("div", { class: "cats" });
    const go_ = h("button", { class: "btn primary", disabled: true, style: "flex:1", text: "Pick a cat" });
    go_.onclick = () => { if (picked) { go_.disabled = true; onPick(picked).catch((e) => { go_.disabled = false; fail(e); }); } };
    function draw() {
      const cats = data.cats.filter((c) => c.catId !== exclude && (!filter || c.coatColor === filter)
        && (!query || (c.displayName || "").toLowerCase().includes(query)));
      grid.replaceChildren(...(cats.length ? cats.map((c) => h("button", { class: "catcard" + (picked && picked.catId === c.catId ? " picked" : ""),
          onclick: () => { picked = c; go_.disabled = false; go_.textContent = confirm(c); draw(); } },
        img(c.thumb, catName(c)),
        h("span", { class: "nm", text: catName(c) }),
        h("span", { class: "meta", text: c.coatColor + " · " + c.coatPattern }))) : [h("p", { class: "muted", text: data.cats.length ? "No cat matches." : "No cats yet — create the first one." })]));
    }
    const filters = h("div", { class: "filters" },
      [null, ...data.coatColors].map((col) => h("button", { class: "fchip", "aria-pressed": String(col === filter),
        onclick: (e) => { filter = col; for (const b of filters.children) b.setAttribute("aria-pressed", String(b.dataset.v === String(col))); draw(); },
        "data-v": String(col), text: col || "All colours" })));
    const search = h("input", { type: "search", placeholder: "Name", oninput: (e) => { query = e.target.value.trim().toLowerCase(); draw(); } });
    draw();
    sheet(h("div", {}, h("h2", { text: title }), subtitle ? h("p", { class: "muted", style: "margin:4px 0 0", text: subtitle }) : null),
      h("label", { class: "field" }, search), filters, grid,
      h("div", { class: "row" }, go_,
        allowNew ? h("button", { class: "btn", onclick: () => { closeOverlay(); catForm(null); }, text: "New cat" }) : null,
        h("button", { class: "btn", onclick: closeOverlay, text: "Cancel" })));
  }

  // ---- new / edit cat ----
  async function catForm(existing) {
    const data = await catalog();
    const f = { displayName: "", coatColor: null, coatPattern: null, distinguishing: "", adminNotes: "", status: "active" };
    if (existing) for (const k of Object.keys(f)) if (existing[k]) f[k] = existing[k];
    const choice = (key, values) => {
      const wrap = h("div", { class: "choice" });
      for (const v of values) wrap.appendChild(h("button", { type: "button", "aria-pressed": String(f[key] === v),
        onclick: () => { f[key] = v; for (const b of wrap.children) b.setAttribute("aria-pressed", String(b.textContent === v)); }, text: v }));
      return wrap;
    };
    const err = h("div", { class: "banner bad", hidden: true });
    const text = (key, ph, area) => h(area ? "textarea" : "input", { value: f[key], rows: area ? 2 : null, placeholder: ph, oninput: (e) => (f[key] = e.target.value) });
    const name = text("displayName", "Leave empty until a name is agreed");
    if (existing) name.value = f.displayName;
    const dist = text("distinguishing", "Ear notch, eye colour, a scar…"); dist.value = f.distinguishing;
    const notes = text("adminNotes", "Anything else", true); notes.value = f.adminNotes;
    const save = h("button", { class: "btn primary", style: "flex:1", text: existing ? "Save" : "Create and assign" });
    save.onclick = async () => {
      if (!f.coatColor || !f.coatPattern) { err.hidden = false; err.textContent = "Pick a coat colour and a pattern — they power the colour filter."; return; }
      save.disabled = true;
      try {
        if (existing) {
          await api("PATCH", "cats/" + existing.catId, { fields: f });
          state.catalog = null; closeOverlay(); toast("Saved"); showCat(existing.catId);
        } else {
          const cat = await api("POST", "cats", { catId: ulid(), fields: f });
          state.catalog = null;
          await assignTo(cat);
        }
      } catch (e) { save.disabled = false; err.hidden = false; err.textContent = e.message; }
    };
    sheet(h("h2", { text: existing ? "Edit " + catName(existing) : "New cat" }),
      !existing ? h("p", { class: "muted", style: "margin:0", text: "Only for a cat you're sure isn't already in the catalogue. If you're not sure, pick from the list — a wrong “new cat” is fixed later with one merge." }) : null,
      h("label", { class: "field" }, h("span", { class: "label", text: "Name (optional)" }), name),
      h("div", { class: "field" }, h("span", { class: "label", text: "Coat colour" }), choice("coatColor", data.coatColors)),
      h("div", { class: "field" }, h("span", { class: "label", text: "Pattern" }), choice("coatPattern", data.coatPatterns)),
      existing ? h("div", { class: "field" }, h("span", { class: "label", text: "Status" }), choice("status", data.statuses)) : null,
      h("label", { class: "field" }, h("span", { class: "label", text: "Distinguishing marks" }), dist),
      h("label", { class: "field" }, h("span", { class: "label", text: "Notes" }), notes),
      err, h("div", { class: "row" }, save, h("button", { class: "btn", onclick: closeOverlay, text: "Cancel" })));
  }

  // ---- cats ----
  function coverageBlock(c, targets) {
    const bar = (value, t, label) => {
      const pct = Math.min(100, (value / t.floor) * 100);
      return h("div", {}, h("div", { class: "row", style: "justify-content:space-between" },
          h("span", { text: label }), h("span", { class: "mono", text: value + " / " + t.floor })),
        h("div", { class: "meter" }, h("i", { class: value >= t.floor ? "" : "below", style: "width:" + pct + "%" })));
    };
    return h("div", { class: "cov" }, bar(c.sessionCount || 0, targets.sessions, "sessions"), bar(c.photoCount || 0, targets.photos, "photos"));
  }

  async function showCats() {
    setTab("cats"); setActions();
    const data = state.catalog = await api("GET", "cats");
    $("ccount").textContent = data.cats.length;
    const need = (c) => (c.coverage.usable ? 1 : 0) * 1e6 + (c.sessionCount || 0) * 1e3 + (c.photoCount || 0);
    let cats = data.cats.filter((c) => !state.catFilter || c.coatColor === state.catFilter);
    cats = cats.slice().sort(state.catSort === "need" ? (a, b) => need(a) - need(b) : (a, b) => catName(a).localeCompare(catName(b)));
    const head = h("div", { class: "card" },
      h("span", { class: "label", text: "Coverage" }),
      h("div", { class: "row", style: "align-items:baseline;margin-top:4px" },
        h("span", { class: "big", text: data.usable }), h("span", { class: "muted", text: "of " + data.cats.length + " cats have usable coverage" })),
      h("p", { class: "muted", style: "margin:6px 0 0;font-size:13.5px",
        text: "Usable = at least " + data.targets.photos.floor + " photos from at least " + data.targets.sessions.floor + " separate encounters. Separate encounters matter most — cats at the top need re-photographing on another day." }));
    const filters = h("div", { class: "filters" },
      [null, ...data.coatColors].map((col) => h("button", { class: "fchip", "aria-pressed": String(col === state.catFilter),
        onclick: () => { state.catFilter = col; showCats().catch(fail); }, text: col || "All" })),
      h("button", { class: "fchip", onclick: () => { state.catSort = state.catSort === "need" ? "name" : "need"; showCats().catch(fail); },
        text: state.catSort === "need" ? "Sorted: needs photos first" : "Sorted: by name" }));
    const grid = cats.length ? h("div", { class: "cats" }, cats.map((c) => h("button", { class: "catcard", onclick: () => go("cat/" + c.catId) },
        img(c.thumb, catName(c)),
        h("span", { class: "nm", text: catName(c) }),
        h("span", { class: "meta" }, h("span", { text: c.coatColor + " · " + c.coatPattern }),
          c.status !== "active" ? h("span", { class: "chip", text: c.status }) : null),
        coverageBlock(c, data.targets))))
      : h("div", { class: "card empty" }, h("b", { text: data.cats.length ? "No cat matches" : "No cats yet" }),
          data.cats.length ? "Try another colour." : "Cats are created from the queue, the first time you label a session.");
    $("main").replaceChildren(head, filters, grid);
  }

  async function showCat(id) {
    setTab("cats");
    const [data, cat_] = [await api("GET", "cats/" + id), await catalog()];
    const c = data.cat;
    if (c.mergedInto) {
      $("main").replaceChildren(h("div", { class: "card stack" }, h("h1", { text: "Merged" }),
        h("p", { text: "This cat was merged into another." }),
        h("button", { class: "btn primary", onclick: () => go("cat/" + c.mergedInto), text: "Go to that cat" })));
      setActions(); return;
    }
    const head = h("div", { class: "stack" },
      h("button", { class: "back", onclick: () => go("cats"), text: "← Cats" }),
      h("div", { class: "row", style: "align-items:flex-start" },
        h("div", { style: "width:96px;flex:none" }, h("div", { class: "tile", style: "cursor:default" }, img(c.thumb, catName(c)))),
        h("div", { class: "grow stack", style: "gap:4px" },
          h("h1", { text: catName(c) }),
          h("div", { class: "meta" }, h("span", { text: c.coatColor + " · " + c.coatPattern }), h("span", { class: "chip", text: c.status })),
          c.distinguishing ? h("p", { style: "margin:0;font-size:14px", text: c.distinguishing }) : null,
          c.adminNotes ? h("p", { class: "muted", style: "margin:0;font-size:13.5px", text: c.adminNotes }) : null)),
      h("div", { class: "card" }, coverageBlock(c, cat_.targets),
        !c.coverage.usable ? h("p", { class: "muted", style: "margin:8px 0 0;font-size:13px", text: "Below the floor for recognition. Another encounter on a different day helps more than more photos from the same one." }) : null));
    const sessions = data.sessions.length ? data.sessions.map((s, i) => h("div", { class: "card sessrow" },
        h("div", { class: "row", style: "justify-content:space-between" },
          h("span", { class: "label", text: "Encounter " + (i + 1) + " · " + s.photos.length + " photos" }),
          h("button", { class: "linkish", onclick: () => go("session/" + s.sessionId), text: "Open session" })),
        h("div", { class: "grid" }, s.photos.map((p) => h("div", { class: "tile", role: "button", tabindex: "0",
            "aria-label": "Use as main photo", onclick: () => setPrimary(c, p) },
          img(p.thumb), p.photoId === c.primaryPhotoId ? h("span", { class: "chip good badge", text: "main" }) : null,
          p.medium ? h("button", { class: "zoom", "aria-label": "View larger", text: "⤢", onclick: (e) => { e.stopPropagation(); lightbox(p.medium); } }) : null)))))
      : [h("div", { class: "card empty" }, h("b", { text: "No photos" }), "Every photo of this cat was rejected or moved.")];
    $("main").replaceChildren(head, ...sessions);
    setActions(
      h("button", { class: "btn", onclick: () => catForm(c).catch(fail), text: "Edit" }),
      h("button", { class: "btn", style: "flex:1", onclick: () => pickCat({
        title: "Merge " + catName(c) + " into…",
        subtitle: "Use this when two entries are the same cat. All of " + catName(c) + "’s photos move to the cat you pick, and " + catName(c) + " leaves the catalogue.",
        exclude: c.catId, confirm: (t) => "Merge into " + catName(t),
        onPick: async (t) => { await api("POST", "cats/" + c.catId + "/merge", { intoCatId: t.catId });
          state.catalog = null; closeOverlay(); toast("Merged into " + catName(t)); go("cat/" + t.catId); } }).catch(fail), text: "Merge into…" }));
  }

  async function setPrimary(c, p) {
    if (p.photoId === c.primaryPhotoId) return;
    await api("PATCH", "cats/" + c.catId, { fields: { primaryPhotoId: p.photoId } }).catch(fail);
    state.catalog = null; toast("Main photo updated"); showCat(c.catId);
  }

  // ---- overlays ----
  function sheet(...content) {
    const box = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", tabindex: "-1" }, ...content);
    const bg = h("div", { class: "sheet-bg", onclick: (e) => { if (e.target === bg) closeOverlay(); } }, box);
    $("overlay").replaceChildren(bg);
    // Focus the dialog itself: focusing its search box would pop the phone
    // keyboard over the very cats the admin is about to tap.
    box.focus({ preventScroll: true });
  }
  function lightbox(src) {
    const bg = h("div", { class: "lightbox", role: "dialog", "aria-label": "Photo", onclick: closeOverlay }, h("img", { src, alt: "" }));
    $("overlay").replaceChildren(bg);
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeOverlay(); });

  // ---- routing ----
  function setTab(t) { for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-current", b.dataset.tab === t ? "page" : "false"); }
  for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => go(b.dataset.tab));
  $("signout").addEventListener("click", () => { clearToken(); gate(); });
  function go(hash) { if (location.hash.slice(1) === hash) route(); else location.hash = hash; }
  async function route() {
    closeOverlay();
    state.token = state.token || loadToken();
    if (!state.token) return gate();
    $("signout").hidden = false;
    const hash = location.hash.slice(1) || "queue";
    const [view, id] = hash.split("/");
    try {
      if (view === "session" && id) await showSession(id);
      else if (view === "cats") await showCats();
      else if (view === "cat" && id) await showCat(id);
      else await showQueue(false);
      window.scrollTo(0, 0);
      if (view !== "queue" && state.queueSize === null) api("GET", "queue").then((d) => { $("qcount").textContent = d.queueSize; state.queueSize = d.queueSize; state.queue = d.sessions; state.queueCursor = d.cursor; }).catch(() => {});
      if (view !== "cats" && view !== "cat") catalog().then((d) => { $("ccount").textContent = d.cats.length; }).catch(() => {});
    } catch (e) {
      if (e.message === "unauthorised") return;
      $("main").replaceChildren(h("div", { class: "card stack" }, h("h1", { text: "Something went wrong" }),
        h("div", { class: "banner bad", text: e.message }),
        h("button", { class: "btn", onclick: () => go("queue"), text: "Back to the queue" })));
      setActions();
    }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
