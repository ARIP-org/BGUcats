name: iOS

# The iPhone app. What TestFlight gets is the app written in Swift
# (native/swift/, docs/ROADMAP.md 2g), since 2026-11-23: screens arrive in
# it one by one. Beside it, the app it replaces: web/ packed with Capacitor
# (native/), still checked here until it is removed. GitHub's macOS runners
# stand in for the Mac nobody here owns.
#
# - swift: builds the Swift app, walks its UI tests through every screen in
#   a simulator, in light and dark, keeping a picture of each, and archives
#   it as the upload will. Swift cannot be compiled on Linux, so this is
#   where anyone sees a screen before it is merged. No secrets, no signing,
#   nothing uploaded. Runs on a pull request, and before every upload.
# - simulator: builds the packed app unsigned and starts it in an iPhone
#   simulator. No secrets. On a pull request only.
# - testflight: archives the Swift app, signs it and uploads to TestFlight.
#   Only from main and only when started by hand (Actions → iOS → Run
#   workflow): the `testflight` environment holds the App Store Connect key
#   and accepts `main` alone.
#
# Nothing here runs on every merge: a build is for a change to the iPhone
# app, or for an upload. docs/deploy.md, "The iPhone app".

on:
  pull_request:
    paths:
      - "native/**"
      - "scripts/native_bundle.py"
      - "scripts/ios_screenshots.py"
      - "scripts/ios_archive.py"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  # A newer push replaces a check; an upload is never cut off half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Which deployment the app belongs to: staging. Its public config.json is
  # packed into the app (scripts/native_bundle.py).
  SITE: https://d2rysfyl47qmmz.cloudfront.net
  PROJECT: native/ios/App/App.xcodeproj
  BUNDLE_ID: org.arip.bgucats

jobs:
  simulator:
    # The packed app is no longer uploaded: its check is for a pull request.
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: pack web/ into the Xcode project
        run: |
          python3 scripts/native_bundle.py --site "$SITE"
          cd native
          npm ci
          npx cap sync ios

      - name: choose a simulator
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [
              device["udid"]
              for runtime in sorted(runtimes)
              if ".iOS-" in runtime
              for device in runtimes[runtime]
              if device["name"].startswith("iPhone")
          ]
          print(phones[-1] if phones else "")
          ')
          if [ -z "$udid" ]; then
            echo "::error::This runner has no iPhone simulator."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"

      - name: build
        run: |
          xcodebuild -list -project "$PROJECT"
          xcodebuild build -quiet \
            -project "$PROJECT" -scheme App -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO

      # What a person would do with a Mac: start the app and look. A Debug
      # build prints the page's console and its uncaught errors, so the log
      # says whether the page loaded, and the screenshot shows what a phone
      # would.
      - name: start it and look
        run: |
          mkdir -p build/ios
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" > build/ios/app.log 2>&1 &
          console=$!
          # Wait for the page, not for a clock. This waited a fixed thirty
          # seconds; on a slow runner the app's first line came ten seconds
          # after the look, and a start that was only late was called a
          # crash (2026-11-23). Up to three minutes for the page to load,
          # then a little for its own start to be logged.
          for _ in $(seq 1 90); do
            if grep -q "WebView loaded" build/ios/app.log; then break; fi
            sleep 2
          done
          sleep 15
          xcrun simctl io "$UDID" screenshot build/ios/launch.png
          running=$(xcrun simctl spawn "$UDID" launchctl list | grep -F "$BUNDLE_ID" || true)
          kill "$console" 2>/dev/null || true
          echo "--- the app's log"
          cat build/ios/app.log
          echo "---"
          if [ -z "$running" ]; then
            echo "::error::The app was not running after its start: it crashed or never started."
            exit 1
          fi
          if ! grep -q "WebView loaded" build/ios/app.log; then
            echo "::error::The web view never finished loading the page."
            exit 1
          fi
          if grep -q "JS ERROR\|JS Eval error" build/ios/app.log; then
            echo "::error::The page threw a JavaScript error on launch (the log above)."
            exit 1
          fi
          # The page says at start whether it found the sign-in plugin
          # (web/app.js, boot). A build without it cannot sign anyone in.
          if ! grep -q "native sign-in: ready" build/ios/app.log; then
            echo "::error::The sign-in plugin (native/plugins/web-auth) did not register with the page."
            exit 1
          fi

      - name: keep the screenshot and the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator
          path: build/ios/
          if-no-files-found: ignore
          retention-days: 14

  # The Swift app. One job builds it, runs it and looks at it: the Mac is
  # the compiler, so a pull request learns here whether it even builds.
  swift:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      PROJECT: native/swift/BGUCats.xcodeproj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: choose a simulator
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [
              device["udid"]
              for runtime in sorted(runtimes)
              if ".iOS-" in runtime
              for device in runtimes[runtime]
              if device["name"].startswith("iPhone")
          ]
          print(phones[-1] if phones else "")
          ')
          if [ -z "$udid" ]; then
            echo "::error::This runner has no iPhone simulator."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"

      # Signed "to run locally", as Xcode signs any simulator build: no
      # team, no certificate, no profile.
      - name: build it
        run: |
          xcodebuild -list -project "$PROJECT"
          xcodebuild build-for-testing -quiet \
            -project "$PROJECT" -scheme BGUCats \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/derived-swift"

      # A simulator that has just started is busy for its first minutes,
      # and whatever runs first pays for it: on 2026-11-24 the first walk
      # failed three runs in a row with the app right, each time somewhere
      # else, and the second walk passed every time. So the first thing to
      # run is not a test: WarmUpUITests opens the app and closes it, by
      # the same road the walk takes, until that is quick. Its result is
      # not counted, and nor is its time limit; the walk decides.
      - name: wake the simulator
        timeout-minutes: 15
        continue-on-error: true
        run: |
          mkdir -p build/ios-swift
          xcrun simctl bootstatus "$UDID" -b
          set +e
          xcodebuild test-without-building \
            -project "$PROJECT" -scheme BGUCats \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/derived-swift" \
            -only-testing:BGUCatsUITests/WarmUpUITests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 420 \
            -maximum-test-execution-time-allowance 420 \
            2>&1 | tee build/ios-swift/warm-up.log |
            grep --line-buffered -E "Test Case|warm-up:|rror:"
          echo "The warm-up ended with ${PIPESTATUS[0]}. It is not a test of the app: the walk decides."
          exit 0

      # The simulator is started first and waited for, so a slow start is
      # not counted against a test. Each test has a time limit of its own:
      # the first run of this job sat for twenty minutes without a word.
      # The limit is for a walk that hangs, not for one that is long: a
      # walk is one test, it grows with every screen, and the first of the
      # two runs on a cold simulator. With five launches of the app the
      # cold one took 281 seconds and the warm one 151 (2026-11-24); at
      # three minutes the cold one was failed with every step passed.
      # Each line "Test Case ... passed (N seconds)" below says how long a
      # test takes now. The step's own limit holds every test of
      # ScreensUITests at its longest, so a hang is reported by the test
      # that hung and not cut off by the step: five tests since Scan a
      # cat, eight minutes each (tests/native/test_swift_app.py). A run
      # where nothing hangs takes a quarter of that.
      # The whole of xcodebuild's output is kept with the pictures; the
      # log here shows the lines that say what happened.
      - name: walk through every screen
        timeout-minutes: 40
        run: |
          mkdir -p build/ios-swift
          xcrun simctl bootstatus "$UDID" -b
          set +e
          xcodebuild test-without-building \
            -project "$PROJECT" -scheme BGUCats \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/derived-swift" \
            -resultBundlePath "$RUNNER_TEMP/swift.xcresult" \
            -only-testing:BGUCatsUITests/ScreensUITests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 480 \
            -maximum-test-execution-time-allowance 480 \
            2>&1 | tee build/ios-swift/xcodebuild.log |
            grep --line-buffered -E "Test (Case|Suite)|error|rror:|XCTAssert|failed|\*\* TEST|Timed out|hung|crash"
          status=${PIPESTATUS[0]}
          echo "xcodebuild ended with $status"
          exit "$status"

      # The upload's own archive: a Release build for a real iPhone,
      # unsigned, and a look at what is in it. A simulator build can pass
      # while this fails; without it, the owner's upload would find out.
      - name: archive it as the upload will
        run: python3 scripts/ios_archive.py "$RUNNER_TEMP/check.xcarchive" --build 1

      - name: the pictures
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/swift.xcresult" ] || { echo "No result: the build did not get as far as the tests."; exit 0; }
          python3 scripts/ios_screenshots.py "$RUNNER_TEMP/swift.xcresult" build/ios-swift

      - name: keep the pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-swift
          path: build/ios-swift/
          if-no-files-found: ignore
          retention-days: 14

  testflight:
    needs: swift
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    # Holds the App Store Connect key; its branch rule admits `main` only.
    environment: testflight
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: what this job needs from the testflight environment
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Says what to add under the name it has in GitHub's settings, not
          # under this job's own name for it. The first run said "no TEAM_ID"
          # when the missing thing was the variable APPLE_TEAM_ID, and a
          # secret called TEAM_ID was added, which nothing reads.
          missing=0
          need() {
            if [ -z "$1" ]; then
              echo "::error::The testflight environment has no $2. GitHub → Settings → Environments → testflight (docs/MANUAL_STEPS.md, step 15)."
              missing=1
            fi
          }
          need "$TEAM_ID" "variable APPLE_TEAM_ID (under Environment variables, not secrets)"
          need "$KEY_ID" "secret APP_STORE_CONNECT_KEY_ID"
          need "$ISSUER_ID" "secret APP_STORE_CONNECT_ISSUER_ID"
          need "$PRIVATE_KEY" "secret APP_STORE_CONNECT_PRIVATE_KEY"
          exit "$missing"

      # The Swift app, by the same script the `swift` job ran a moment ago.
      # Unsigned: the export below signs it for distribution with a
      # certificate Apple keeps, so no certificate or profile is ever stored
      # here. The build number is this run's number: App Store Connect wants
      # a new one every time, and it says which run made a build.
      - name: archive
        run: |
          python3 scripts/ios_archive.py "$RUNNER_TEMP/BGUCats.xcarchive" \
            --build "$GITHUB_RUN_NUMBER" --team "$TEAM_ID"

      - name: sign and upload to TestFlight
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          (umask 077 && printf '%s\n' "$PRIVATE_KEY" > "$key")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BGUCats.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          {
            echo "### Uploaded to App Store Connect"
            echo
            echo "Build **$GITHUB_RUN_NUMBER** of commit \`${GITHUB_SHA::7}\`: the app written in Swift (native/swift/)."
            echo "Apple processes a build for some minutes before TestFlight offers it."
          } >> "$GITHUB_STEP_SUMMARY"

      # Xcode's own account of a failed signing or upload. Without it the
      # job log only says that the export failed.
      - name: why the export failed
        if: failure()
        run: |
          find /var/folders "$HOME/Library/Logs" -name "IDEDistribution.critical.log" 2>/dev/null |
            while read -r log; do
              echo "== $log"
              tail -n 200 "$log"
            done

      - name: forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
