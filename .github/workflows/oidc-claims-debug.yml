name: OIDC claims (debug)

# One-off: shows the exact `sub` claim a job in the `production` environment
# gets, so the deploy role's trust policy (infra/bootstrap/deploy_role.tf)
# can be checked against it before anything relies on it. Prints decoded
# claims only, never the token. Delete this file once the deploy role works.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Print the token's claims
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          # The payload is the JWT's middle segment, base64url without padding.
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d \
            | jq '{sub, aud, environment, ref, repository, job_workflow_ref}'
