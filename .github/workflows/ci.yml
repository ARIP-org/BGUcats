name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: pytest
        # Exit code 5 = "no tests collected" — expected until tests/ has
        # content, not a real failure. Any other non-zero code still fails.
        run: |
          set +e
          pytest
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then
            exit 0
          fi
          exit "$code"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: fmt check
        run: |
          terraform -chdir=infra/bootstrap fmt -check -recursive
          terraform -chdir=infra/main fmt -check -recursive

      - name: validate (no backend, no AWS creds needed)
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/main init -backend=false
          terraform -chdir=infra/main validate

      # The Lambda deployment packages archive_file reads from — needed
      # for plan to compute source_code_hash, even though nothing is
      # applied here.
      - name: build Lambda packages
        run: make build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::851725214678:role/bgucats-github-actions-ci
          aws-region: us-east-1

      - name: plan (infra/main only — bootstrap is applied by hand)
        # Placeholder secret values: this CI role can only read the
        # tfstate backend (infra/README.md's incremental-IAM convention),
        # so it couldn't apply even if it tried. Real values live in a
        # gitignored terraform.tfvars, applied by hand.
        env:
          TF_VAR_telegram_bot_token: "ci-plan-placeholder"
          TF_VAR_telegram_webhook_secret: "ci-plan-placeholder"
          TF_VAR_submitter_hash_salt: "ci-plan-placeholder"
        run: |
          terraform -chdir=infra/main init -reconfigure
          terraform -chdir=infra/main plan
