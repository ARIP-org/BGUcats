name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # The browser tests/web drives through the app's screens.
      - run: playwright install --with-deps chromium
      - run: ruff check .
      - name: pytest
        env:
          # Without it the browser tests skip when no browser can start,
          # which is right on a laptop and wrong here.
          BGUCATS_REQUIRE_BROWSER: "1"
        run: pytest

      # What every screen looked like in this run, at a phone's size. They
      # show the tests' made-up campus, never a real photo.
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write # the plan summary comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
          # The wrapper re-prints stdout, which would garble the JSON plan
          # that the summary below reads.
          terraform_wrapper: false

      - name: fmt check
        run: |
          terraform -chdir=infra/bootstrap fmt -check -recursive
          terraform -chdir=infra/main fmt -check -recursive
          terraform -chdir=infra/org fmt -check -recursive

      - name: validate (no backend, no AWS creds needed)
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/main init -backend=false
          terraform -chdir=infra/main validate
          terraform -chdir=infra/org init -backend=false
          terraform -chdir=infra/org validate

      # The Lambda deployment packages archive_file reads from — needed
      # for plan to compute source_code_hash, even though nothing is
      # applied here.
      - name: build Lambda packages
        run: make build

      # The role lives in the production account. Its ARN is a repository
      # variable, not an environment one: a PR run has no environment.
      - name: check the CI role is configured
        env:
          ROLE: ${{ vars.AWS_CI_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::Repository variable AWS_CI_ROLE_ARN is not set (docs/MANUAL_STEPS.md)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: plan (infra/main only — bootstrap is applied by hand)
        # PR runs get no environment secrets, and this role can only read
        # (infra/README.md). The one variable left is not a secret; the
        # bot's secrets and Google's are outside Terraform (infra/main/ssm.tf).
        # No lock: this plan changes nothing, and it runs at the same time as
        # Deploy on every merge. Holding the lock could fail either of them.
        env:
          TF_VAR_environment: production
          TF_VAR_bootstrap_admin_email: "ci-plan-placeholder@example.com"
        run: |
          terraform -chdir=infra/main init -reconfigure -backend-config=backend/prod.hcl
          terraform -chdir=infra/main plan -input=false -lock=false -out=tfplan

      # A new kind of resource, a provisioned table or an oversized Lambda
      # turns this job red: each is a cost decision for the owner, not
      # something to read past in a long plan (scripts/check_plan.py).
      - name: plan check (allowed resource types, cost limits)
        run: |
          terraform -chdir=infra/main show -json tfplan \
            | python scripts/check_plan.py infra/main/allowed-resource-types.txt

      # Counts, actions and addresses only. The JSON plan holds sensitive
      # values in clear text, so it goes straight into jq, and the plan file
      # is never uploaded. Destroys sort first: they are what to look for
      # (docs/deploy.md, "Reading the plan").
      - name: plan summary
        run: |
          {
            terraform -chdir=infra/main show -no-color tfplan | grep -E '^(Plan:|No changes)' || echo "No summary line in the plan."
            echo
            terraform -chdir=infra/main show -json tfplan | jq -r '[(.resource_changes // [])[]
              | select(.mode == "managed" and .change.actions != ["no-op"])
              | {a: (.change.actions | join("+")), r: .address}]
              | sort_by((.a | contains("delete") | not), .r)[]
              | "- `\(.a)` `\(.r)`"'
          } > plan-summary.md
          cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, updated on each push. A failure here must not
      # block a merge: the plan itself has already passed, and it is in the log.
      - name: post the plan summary on the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- terraform-plan-summary -->'
          body=$(printf '%s\n**Terraform plan** at %s\n\n%s\n' "$marker" "$SHA" "$(cat plan-summary.md)")
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" --silent
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" --silent
          fi
