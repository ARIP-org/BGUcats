name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # The browser tests/web drives through the app's screens.
      - run: playwright install --with-deps chromium
      - run: ruff check .
      - name: pytest
        env:
          # Without it the browser tests skip when no browser can start,
          # which is right on a laptop and wrong here.
          BGUCATS_REQUIRE_BROWSER: "1"
        run: pytest

      # What every screen looked like in this run, at a phone's size. They
      # show the tests' made-up campus, never a real photo.
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write # the plan summary comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
          # The wrapper re-prints stdout, which would garble the JSON plan
          # that the summary below reads.
          terraform_wrapper: false

      - name: fmt check
        run: |
          terraform -chdir=infra/bootstrap fmt -check -recursive
          terraform -chdir=infra/main fmt -check -recursive
          terraform -chdir=infra/org fmt -check -recursive

      - name: validate (no backend, no AWS creds needed)
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/main init -backend=false
          terraform -chdir=infra/main validate
          terraform -chdir=infra/org init -backend=false
          terraform -chdir=infra/org validate

      # The Lambda deployment packages archive_file reads from — needed
      # for plan to compute source_code_hash, even though nothing is
      # applied here.
      - name: build Lambda packages
        run: make build

      # One CI role per account, with the same name (infra/bootstrap): it can
      # read what a plan needs and nothing else. The account IDs are read
      # from the backend files, the one place they are written. A PR run has
      # no environment, so these cannot be environment variables.
      - name: the two accounts' CI roles
        id: roles
        run: |
          for backend in staging prod; do
            account=$(sed -n 's/^bucket *= *"bgucats-tfstate-\([0-9]\{12\}\)".*/\1/p' "infra/main/backend/$backend.hcl")
            if [ -z "$account" ]; then
              echo "::error::No account ID in infra/main/backend/$backend.hcl."
              exit 1
            fi
            echo "$backend=arn:aws:iam::$account:role/bgucats-github-actions-ci" >> "$GITHUB_OUTPUT"
          done

      # Two plans of infra/main, one per account, each followed by the plan
      # check (scripts/ci_plan.sh). Staging first: it is what merging this
      # pull request deploys. PR runs get no environment secrets, and these
      # roles can only read (infra/README.md).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.roles.outputs.staging }}
          aws-region: us-east-1

      - name: plan staging (what merging deploys)
        run: scripts/ci_plan.sh staging

      # Production runs the latest v* tag, so its plan holds this change and
      # every merged change not promoted yet.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.roles.outputs.prod }}
          aws-region: us-east-1

      - name: plan production (what the next promote would deploy)
        run: scripts/ci_plan.sh production

      # Counts, actions and addresses only: the plan files are never
      # uploaded.
      - name: plan summary
        run: |
          {
            echo "### Staging: what merging this deploys"
            echo
            cat plan-summary-staging.md
            echo
            echo "### Production: what the next promote would deploy"
            echo
            echo "This change and everything merged since the last \`v*\` tag."
            echo
            cat plan-summary-production.md
          } > plan-summary.md
          cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, updated on each push. A failure here must not
      # block a merge: both plans have already passed, and they are in the log.
      - name: post the plan summary on the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- terraform-plan-summary -->'
          body=$(printf '%s\n**Terraform plans** at %s\n\n%s\n' "$marker" "$SHA" "$(cat plan-summary.md)")
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" --silent
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" --silent
          fi
