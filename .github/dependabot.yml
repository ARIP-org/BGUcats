# Monthly, grouped, so an update is one PR to read and not ten. Every merge
# deploys, so each of these goes through the same CI and the same plan as
# any other change (docs/deploy.md, "Dependabot").
#
# research/ is left out on purpose: a torch or timm bump can change an exported
# model, which is a decision, not a chore. pandas is left out with it, because
# requirements-dev.txt keeps the same pin as research/requirements.txt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /
      - /src/admin
      - /src/beacon
      - /src/ingest
      - /src/process
    schedule:
      interval: monthly
    ignore:
      - dependency-name: pandas
    groups:
      python:
        patterns: ["*"]
